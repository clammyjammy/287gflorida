            const df = [...june_pa, ...florida, ...texas];
            const agency_const = 2;   // agency name
            const lat_const = 8;      // latitude
            const long_const = 9;     // longitude
            const name_const = 10;    // name
            const position_const = 11;
            const phone_num_const = 12;
            const email_const = 13;
            const disclosure_const = 14;

            // --- Build markers + KNN index from your real dataset ---
            const markers = [];
            const features = [];

            for (let i = 0; i < df.length; i++) {
                const agency = df[i][agency_const];
                const position = df[i][position_const];
                const phone_num = df[i][phone_num_const];
                const email = df[i][email_const];
                const disclosure = df[i][disclosure_const];
                const lat = df[i][lat_const];
                const long = df[i][long_const];
                const name = df[i][name_const];

                const marker = L.marker([lat, long]).addTo(map);
                marker.bindPopup(`<b>Agency</b>: ${agency}<br><b>Name</b>: ${name}<br><b>Position</b>: ${position}<br><b>Phone Number</b>: ${phone_num}<br><b>Email</b>: ${email}<br><b>Contract Disclosure</b>: ${disclosure}<br>`);
                markers.push(marker);

                features.push({
                    type: "Feature",
                    properties: { index: i, agency, name },
                    geometry: { type: "Point", coordinates: [long, lat] }
                });
            }

            function haversineDistance(lat1, lon1, lat2, lon2) {
                const R = 6371; // km
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) ** 2 +
                        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                        Math.sin(dLon/2) ** 2;
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            }

            function findNearest(lat, lon, k = 5) {
                return df
                    .map((row, idx) => ({
                        idx,
                        dist: haversineDistance(lat, lon, row[lat_const], row[long_const])
                    }))
                    .sort((a, b) => a.dist - b.dist)
                    .slice(0, k);
            }

            const geojson = { type: "FeatureCollection", features };
            // const knnIndex = leafletKnn(geojson);

            // --- Search functionality ---
            let highlightLayer = null;

            async function runSearch() {
                const city = document.getElementById('city-input').value.trim();
                if (!city) return;

                try {
                    const loc = await geocodeCity(city);

                    const nearest = findNearest(loc.lat, loc.lon, 5);

                    if (highlightLayer) map.removeLayer(highlightLayer);
                    highlightLayer = L.layerGroup();

                    const userMarker = L.marker([loc.lat, loc.lon]).bindPopup(`You searched: ${city}`);
                    highlightLayer.addLayer(userMarker);

                    nearest.forEach(({ idx, dist }) => {
                        const lat = df[idx][lat_const];
                        const lon = df[idx][long_const];
                        const line = L.polyline([[loc.lat, loc.lon], [lat, lon]], { color: 'green', dashArray: '4' })
                            .bindTooltip(`${dist.toFixed(1)} km`);
                        highlightLayer.addLayer(line);
                        markers[idx].openPopup();
                    });

                    highlightLayer.addTo(map);
                    map.setView([loc.lat, loc.lon], 9);

                } catch (err) {
                    console.error("Search error:", err);
                    alert("Error: " + err.message);
                }
            }

            document.getElementById('search-btn').addEventListener('click', runSearch);
            document.getElementById('city-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') runSearch();
            });

            async function geocodeCity(city) {
                const url = `https://nominatim.openstreetmap.org/search?format=json&countrycodes=us&q=${encodeURIComponent(city)}`;
                console.log("Geocoding URL:", url);
                const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
                console.log("Response status:", res.status);
                if (!res.ok) {
                    const text = await res.text();
                    console.log("Response body:", text);
                    throw new Error(`Geocoding request failed: ${res.status}`);
                }
                const data = await res.json();
                if (!data.length) throw new Error("City not found");
                return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
            }
